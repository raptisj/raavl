name: Library

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: library-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Node ${{ matrix.node }} / React ${{ matrix.react }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: '22'
            react: '18'
          - node: '24'
            react: '19'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Release declarations are authored with the pinned React 19 toolchain.
      # Check that same output with React 18 peers instead of rebuilding it.
      - run: npm run build
      - name: Install React 18 consumer peers
        if: matrix.react == '18'
        run: npm install --no-save --package-lock=false react@18 react-dom@18 @types/react@18 @types/react-dom@18
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: package-test-results-node-${{ matrix.node }}
          path: test-results/
          if-no-files-found: ignore
